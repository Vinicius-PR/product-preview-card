<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main class="container">
    <article class="product-card">
      <picture class="product-image">
        <source
          media="(min-width: 700px)"
          srcset="images/image-product-desktop.jpg"
        >
        <img
          src="images/image-product-mobile.jpg"
          alt="Gabrielle Essence Eau De Parfum bottle Perfume"
        >
      </picture>
      
      <div class="content">
        <div class="content-text">
          <p class="category text-preset-4">perfume</p>

          <h1 class="title text-preset-1">
            Gabrielle Essence Eau De Parfum
          </h1>

          <p class="description text-preset-3">
            A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
          </p>
        </div>

        <div class="price">
          <span class="current-price text-preset-1">$149.99</span>
          <span class="old-price text-preset-5">$169.99</span>
        </div>

        <button class="add-card-btn">
          <img src="./images/icon-cart.svg" alt="icon button add to card">
          <span class="text-preset-2 ">Add to Card</span>
        </button>
      </div>

    </article>
  </main>
</body>
</html>
